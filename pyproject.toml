[project]
name = "verityflow"
version = "0.1.0"
description = "AI-assisted workflow compliance reviewer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8,<3",
    "typer>=0.12,<1",
    "networkx>=3.3,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "jsonschema>=4.22",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
verityflow = "verityflow.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verityflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not holdout'"
markers = [
    "holdout: sealed holdout bundles; run only through scripts/run_eval.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Evaluation tooling invokes only the repository's own git and interpreter.
"evaluation/**" = ["S101", "S603", "S607"]
"scripts/**" = ["S101", "S603", "S607"]
# This fixture intentionally contains unsupported Python loop syntax.
"evaluation/bundles/E06_unsupported_python/*" = ["B007"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["networkx.*"]
ignore_missing_imports = true
